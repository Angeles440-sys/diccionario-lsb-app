<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario LSB - Lengua de Señas Boliviana</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Diccionario Básico de Lengua de Señas (LSB)</h1>
        <p>Una aplicación de accesibilidad para aprender señas básicas.</p>
    </header>

    <main>
        <section class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar seña (ej. Hola, Gracias, Familia)...">
        </section>

        <section class="dictionary-grid" id="dictionaryGrid">
            <!-- Las tarjetas se cargarán dinámicamente con JavaScript -->
        </section>
    </main>

    <footer>
        <p>Desarrollado para la comunidad sorda y personas interesadas en LSB.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
